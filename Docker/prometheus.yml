# prometheus.yml
global:
  scrape_interval: 15s  # How often Prometheus will scrape targets

scrape_configs:
  - job_name: 'kafka'
    static_configs:
      - targets: ['broker:9404','localhost:9404']
    scheme: http
      
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
      
  - job_name: 'datahub-app'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080','172.17.32.1:8080','datahub-app:8080']

  - job_name: 'adapter-app'
    scrape_interval: 5s
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8180','172.17.32.1:8180','172.17.32.1:8280','adapter-1:8180','adapter-2:8280']